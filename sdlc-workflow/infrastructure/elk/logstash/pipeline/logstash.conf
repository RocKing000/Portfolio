input {
  # Receive structured logs from .NET services via TCP
  tcp {
    port => 5044
    codec => json_lines
    tags => ["dotnet"]
  }

  # Receive structured logs from Python agents via TCP
  tcp {
    port => 5045
    codec => json_lines
    tags => ["python-agent"]
  }

  # RabbitMQ dead-letter queue monitoring
  rabbitmq {
    host => "rabbitmq"
    port => 5672
    user => "${RABBITMQ_USER}"
    password => "${RABBITMQ_PASSWORD}"
    vhost => "sdlc"
    queue => "dlx.dead-letters"
    durable => true
    tags => ["dead-letter"]
  }
}

filter {
  # Parse timestamp if present
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }
  }

  # Enrich with environment
  mutate {
    add_field => { "environment" => "development" }
    add_field => { "suite" => "sdlc-automation" }
  }

  # Drop health check noise
  if [message] =~ /healthcheck/ or [message] =~ /\/health/ {
    drop {}
  }

  # Parse LLM call events for cost tracking
  if [event_type] == "LLMCall" {
    mutate {
      convert => {
        "prompt_tokens"     => "integer"
        "completion_tokens" => "integer"
        "cost_usd"          => "float"
        "latency_ms"        => "integer"
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "sdlc-logs-%{+YYYY.MM.dd}"
    ilm_enabled => false
  }

  # Mirror critical audit events to a separate index
  if [event_type] in ["ClientApproval", "ConflictDecision", "SystemEvent"] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      user => "elastic"
      password => "${ELASTIC_PASSWORD}"
      index => "sdlc-audit-%{+YYYY.MM.dd}"
      ilm_enabled => false
    }
  }
}
