# Redis Configuration — SDLC Automation Suite

requirepass ${REDIS_PASSWORD}

# Persistence (RDB snapshots for session recovery)
save 900 1
save 300 10
save 60 10000

# Memory management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Keyspace notifications (for session expiry events)
notify-keyspace-events Ex

# Logging
loglevel notice
logfile ""

# Network
bind 0.0.0.0
protected-mode no
tcp-keepalive 300
