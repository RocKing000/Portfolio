<div class="widget-container">
  <!-- Header (drag handle) -->
  <div class="widget-header widget-drag-handle">
    <span class="widget-title">{{ title }}</span>
    <div class="widget-actions">
      <button mat-icon-button matTooltip="Configure" (click)="openConfig(); $event.stopPropagation()">
        <mat-icon>settings</mat-icon>
      </button>
      <button mat-icon-button matTooltip="Remove" (click)="remove(); $event.stopPropagation()">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>

  <!-- Widget body -->
  <div class="widget-body">
    @switch (widget.widgetType) {
      @case ('CHART_LINE') {
        <app-chart-line-widget [config]="parsedConfig"></app-chart-line-widget>
      }
      @case ('CHART_BAR') {
        <app-chart-bar-widget [config]="parsedConfig"></app-chart-bar-widget>
      }
      @case ('CHART_PIE') {
        <app-chart-pie-widget [config]="parsedConfig"></app-chart-pie-widget>
      }
      @case ('TABLE') {
        <app-table-widget [config]="parsedConfig"></app-table-widget>
      }
      @default {
        <app-metric-card-widget [config]="parsedConfig"></app-metric-card-widget>
      }
    }
  </div>
</div>
