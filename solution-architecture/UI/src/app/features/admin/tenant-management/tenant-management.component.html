<div class="admin-page">
  <div class="page-header">
    <div>
      <a routerLink="/admin" class="back-link">← Admin</a>
      <h1>Tenant Management</h1>
    </div>
    <button mat-flat-button color="primary" (click)="openCreate()">
      <mat-icon>add_business</mat-icon> New Tenant
    </button>
  </div>

  @if (loading) {
    <div class="loading-center"><mat-spinner diameter="40"></mat-spinner></div>
  } @else {
    <table mat-table [dataSource]="tenants" class="data-table">

      <ng-container matColumnDef="tenantCode">
        <th mat-header-cell *matHeaderCellDef>Code</th>
        <td mat-cell *matCellDef="let row"><code>{{ row.tenantCode }}</code></td>
      </ng-container>

      <ng-container matColumnDef="tenantName">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let row">{{ row.tenantName }}</td>
      </ng-container>

      <ng-container matColumnDef="contactEmail">
        <th mat-header-cell *matHeaderCellDef>Contact</th>
        <td mat-cell *matCellDef="let row">{{ row.contactEmail ?? '-' }}</td>
      </ng-container>

      <ng-container matColumnDef="isActive">
        <th mat-header-cell *matHeaderCellDef>Active</th>
        <td mat-cell *matCellDef="let row">
          <mat-icon [class]="row.isActive ? 'active' : 'inactive'">
            {{ row.isActive ? 'check_circle' : 'cancel' }}
          </mat-icon>
        </td>
      </ng-container>

      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef>Created</th>
        <td mat-cell *matCellDef="let row">{{ row.createdAt | date:'dd MMM yyyy' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row" class="actions-cell">
          <button mat-icon-button matTooltip="Edit" (click)="openEdit(row)">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    @if (tenants.length === 0) {
      <div class="empty">No tenants found.</div>
    }
  }
</div>
