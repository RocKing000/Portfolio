<header class="app-header">
  <div class="header-inner">

    <!-- Sidenav toggle -->
    <button class="icon-btn hamburger" (click)="menuToggle.emit()" aria-label="Toggle navigation">
      <mat-icon>menu</mat-icon>
    </button>

    <!-- Brand -->
    <div class="brand">
      <div class="brand-logo">
        <svg width="30" height="30" viewBox="0 0 32 32">
          <defs>
            <linearGradient id="navBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#003D7A;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#0052A5;stop-opacity:1" />
            </linearGradient>
            <linearGradient id="navSGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#E8F0FA;stop-opacity:1" />
              <stop offset="50%" style="stop-color:#5A9FD4;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#1E6DBF;stop-opacity:1" />
            </linearGradient>
            <linearGradient id="navSpearGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color:#FFB088;stop-opacity:1" />
              <stop offset="50%" style="stop-color:#FF6B35;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#E55A2B;stop-opacity:1" />
            </linearGradient>
          </defs>
          <rect width="32" height="32" rx="6" fill="url(#navBgGrad)"/>
          <rect x="4" y="4" width="24" height="24"
                fill="none" stroke="#5A9FD4" stroke-width="0.75" opacity="0.4"/>
          <rect x="15" y="7" width="2" height="18" fill="url(#navSpearGrad)" rx="0.5"/>
          <polygon points="16,4 14,7 18,7" fill="url(#navSpearGrad)"/>
          <polygon points="16,28 14,25 18,25" fill="url(#navSpearGrad)"/>
          <text x="16" y="22"
                font-family="Outfit, sans-serif"
                font-size="18" font-weight="800"
                fill="url(#navSGrad)"
                text-anchor="middle"
                stroke="#003D7A" stroke-width="0.3">S</text>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">SARGE</span>
        <span class="brand-tagline">Signal Analytics</span>
      </div>
    </div>

    <!-- Current route indicator -->
    <div class="current-route">
      <mat-icon class="route-icon">navigate_next</mat-icon>
      <span class="route-label">{{ currentRouteName() }}</span>
    </div>

    <!-- Right actions -->
    <div class="header-right">

      <!-- Notifications -->
      <button class="icon-btn notif-btn"
              [routerLink]="['/signals']"
              aria-label="View signals"
              matTooltip="View signals">
        <mat-icon>notifications_outlined</mat-icon>
        @if (criticalCount() > 0) {
          <span class="notif-badge">{{ criticalCount() }}</span>
        }
      </button>

      <div class="separator"></div>

      <!-- User chip -->
      @if (authSvc.currentUserDto; as user) {
        <div class="user-chip" matTooltip="Signed in as {{ user.fullName || user.username }}">
          <div class="user-avatar">{{ userInitials() }}</div>
          <div class="user-meta">
            <span class="user-name">{{ user.fullName || user.username }}</span>
            <span class="user-role">SARGE Platform</span>
          </div>
        </div>
      }

      <!-- Logout -->
      <button class="icon-btn logout-btn" (click)="logout()" aria-label="Sign out" matTooltip="Sign out">
        <mat-icon>logout</mat-icon>
      </button>

    </div>
  </div>
</header>
