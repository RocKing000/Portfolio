<div class="admin-page">
  <div class="page-header">
    <div>
      <a routerLink="/admin" class="back-link">← Admin</a>
      <h1>User Management</h1>
    </div>
    <button mat-flat-button color="primary" (click)="openCreate()">
      <mat-icon>person_add</mat-icon> New User
    </button>
  </div>

  @if (loading) {
    <div class="loading-center"><mat-spinner diameter="40"></mat-spinner></div>
  } @else {
    <table mat-table [dataSource]="users" class="data-table">

      <ng-container matColumnDef="username">
        <th mat-header-cell *matHeaderCellDef>Username</th>
        <td mat-cell *matCellDef="let row"><code>{{ row.username }}</code></td>
      </ng-container>

      <ng-container matColumnDef="fullName">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let row">{{ row.firstName }} {{ row.lastName }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let row">{{ row.email }}</td>
      </ng-container>

      <ng-container matColumnDef="roleName">
        <th mat-header-cell *matHeaderCellDef>Role</th>
        <td mat-cell *matCellDef="let row"><span class="chip">{{ row.roleName }}</span></td>
      </ng-container>

      <ng-container matColumnDef="tenantName">
        <th mat-header-cell *matHeaderCellDef>Tenant</th>
        <td mat-cell *matCellDef="let row">{{ row.tenantName }}</td>
      </ng-container>

      <ng-container matColumnDef="isActive">
        <th mat-header-cell *matHeaderCellDef>Active</th>
        <td mat-cell *matCellDef="let row">
          <mat-icon [class]="row.isActive ? 'active' : 'inactive'">
            {{ row.isActive ? 'check_circle' : 'cancel' }}
          </mat-icon>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row" class="actions-cell">
          <button mat-icon-button matTooltip="Edit" (click)="openEdit(row)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button matTooltip="Reset Password" (click)="openResetPassword(row)">
            <mat-icon>lock_reset</mat-icon>
          </button>
          <button mat-icon-button matTooltip="Deactivate" color="warn" (click)="delete(row)" [disabled]="!row.isActive">
            <mat-icon>person_off</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" [class.inactive-row]="!row.isActive"></tr>
    </table>

    @if (users.length === 0) {
      <div class="empty">No users found.</div>
    }
  }
</div>
