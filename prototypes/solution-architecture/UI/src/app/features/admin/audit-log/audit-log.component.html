<div class="admin-page">
  <div class="page-header">
    <div>
      <a routerLink="/admin" class="back-link">← Admin</a>
      <h1>Audit Logs</h1>
    </div>
    <button mat-stroked-button (click)="load()">
      <mat-icon>refresh</mat-icon> Refresh
    </button>
  </div>

  @if (loading) {
    <div class="loading-center"><mat-spinner diameter="40"></mat-spinner></div>
  } @else {
    <table mat-table [dataSource]="logs" class="data-table">

      <ng-container matColumnDef="performedAt">
        <th mat-header-cell *matHeaderCellDef>Time</th>
        <td mat-cell *matCellDef="let row">{{ row.performedAt | date:'dd MMM yyyy HH:mm:ss' }}</td>
      </ng-container>

      <ng-container matColumnDef="performedBy">
        <th mat-header-cell *matHeaderCellDef>User</th>
        <td mat-cell *matCellDef="let row"><code>{{ row.performedBy }}</code></td>
      </ng-container>

      <ng-container matColumnDef="tableName">
        <th mat-header-cell *matHeaderCellDef>Table</th>
        <td mat-cell *matCellDef="let row"><span class="chip">{{ row.tableName }}</span></td>
      </ng-container>

      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let row">
          <span [class]="'action-badge ' + getActionClass(row.action)">{{ row.action }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="details">
        <th mat-header-cell *matHeaderCellDef>Details</th>
        <td mat-cell *matCellDef="let row">
          <span class="value-cell" [matTooltip]="row.details ?? ''">{{ row.details | slice:0:80 }}</span>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    @if (logs.length === 0) {
      <div class="empty">No audit records found.</div>
    }
  }
</div>
