<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIRE-X | Decision Intelligence & Risk Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background: #0a0f1a;
        margin: 0;
        padding: 0;
      }
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #0a0f1a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        transition: opacity 0.7s ease-out;
        will-change: opacity;
      }
      #app-loader.hide {
        opacity: 0;
        pointer-events: none;
      }
      .app-loader-dots {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .app-loader-dots span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #00d4ff;
        will-change: opacity;
        animation: dotWave 1.2s ease-in-out infinite;
      }
      .app-loader-dots span:nth-child(2) { animation-delay: 0.4s; }
      .app-loader-dots span:nth-child(3) { animation-delay: 0.8s; }
      .app-loader-label {
        color: #64748b;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-family: 'JetBrains Mono', monospace;
        will-change: opacity;
        opacity: 0.35;
      }
      @keyframes dotWave {
        0%   { opacity: 0.12; }
        33%  { opacity: 1; }
        67%  { opacity: 0.12; }
        100% { opacity: 0.12; }
      }
    </style>
  </head>
  <body>
    <div id="app-loader">
      <div class="app-loader-dots">
        <span></span><span></span><span></span>
      </div>
      <span class="app-loader-label">Loading</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
